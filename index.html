<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zero One Education — English Assessment</title>
<style>
  :root {
    --navy: #0B123C; --blue: #3372B9; --red: #ED1B24;
    --bg: #f3f5f9; --panel: #ffffff; --border: #dfe4ec; --text: #17203a; --dim: #66708a;
    --good: #18935f; --good-bg: #e6f6ee; --warn: #c27709; --warn-bg: #fdf3e2; --bad: #d6343b; --bad-bg: #fdecec;
    --flag: #e08a00;
    --radius: 12px; --shadow: 0 1px 2px rgba(11,18,60,.05), 0 6px 18px rgba(11,18,60,.07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  header.top { background: var(--navy); color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 30; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; }
  .brand .logo-img { height: 40px; width: auto; display: block; background: #fff; border-radius: 8px; padding: 4px 8px; }
  .brand .brand-sub { font-size: 12px; font-weight: 600; line-height: 1.25; opacity: .85; letter-spacing: .03em; border-left: 1px solid rgba(255,255,255,.3); padding-left: 10px; }
  @media (max-width: 560px) { .brand .logo-img { height: 32px; } .brand .brand-sub { display: none; } }
  .top .spacer { flex: 1; }
  .timer, .lstat { background: rgba(255,255,255,.12); border-radius: 999px; padding: 5px 12px; font-weight: 700; font-variant-numeric: tabular-nums; display: none; white-space: nowrap; }
  .timer.low { background: var(--red); }
  .lstat .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-right: 7px; vertical-align: -1px; }
  .lstat .eq i { width: 3px; background: #9fd0ff; border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .lstat .eq i:nth-child(2) { animation-delay: .15s; } .lstat .eq i:nth-child(3) { animation-delay: .3s; } .lstat .eq i:nth-child(4) { animation-delay: .45s; }
  @keyframes eq { 0%, 100% { height: 3px; } 50% { height: 12px; } }
  .lstat.wait { background: #f5b400; color: #2a1c00; }
  .vol { display: none; align-items: center; gap: 6px; font-size: 12px; opacity: .9; }
  .vol input { width: 80px; accent-color: #9fd0ff; }
  .save-state { font-size: 12px; opacity: .8; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .card + .card { margin-top: 16px; }
  h1 { font-size: 24px; margin: 0 0 6px; color: var(--navy); }
  h2 { font-size: 19px; margin: 0 0 8px; color: var(--navy); }
  h3 { font-size: 16px; margin: 0 0 6px; }
  .dim { color: var(--dim); }
  .btn { appearance: none; border: none; border-radius: 9px; padding: 11px 18px; font-weight: 700; font-size: 14.5px; cursor: pointer; background: var(--blue); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--blue); border: 1px solid var(--border); }
  .btn.green { background: var(--good); }
  .btn.sm { padding: 6px 12px; font-size: 13px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 16px; }
  .steps span { font-size: 12px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: #e6eaf2; color: var(--dim); }
  .steps span.on { background: var(--navy); color: #fff; }
  .steps span.done { background: var(--good-bg); color: var(--good); }
  ul.tips { margin: 8px 0 0; padding-left: 20px; } ul.tips li { margin: 4px 0; }
  .notice { border-radius: 10px; padding: 12px 14px; font-size: 14px; margin: 12px 0; }
  .notice.info { background: #eaf1fb; color: #1f4f8a; }
  .notice.warn { background: var(--warn-bg); color: #8a5300; }
  .notice.bad { background: var(--bad-bg); color: #9b1c22; }
  .notice.good { background: var(--good-bg); color: #0f6b44; }
  .q { padding: 12px 0; border-top: 1px solid var(--border); position: relative; }
  .q:first-child { border-top: none; }
  .qn { display: inline-block; min-width: 30px; margin-right: 4px; font-weight: 800; color: var(--blue); }
  .q input[type=text] { margin-top: 6px; width: 100%; max-width: 360px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
  input[type=text]:focus, textarea:focus, select:focus { outline: 2px solid rgba(51,114,185,.35); border-color: var(--blue); }
  .opts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .opts.inline { flex-direction: row; flex-wrap: wrap; }
  .opts label { display: flex; align-items: flex-start; gap: 8px; padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; background: #fbfcfe; }
  .opts label:has(input:checked) { border-color: var(--blue); background: #eaf1fb; }
  .opts input { margin-top: 4px; }
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .passage { max-height: 72vh; overflow: auto; position: sticky; top: 72px; }
  .passage p { margin: 0 0 12px; }
  textarea { width: 100%; min-height: 300px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font: 15px/1.6 inherit; resize: vertical; }
  .wc { font-size: 13px; color: var(--dim); margin-top: 6px; } .wc.ok { color: var(--good); }
  .prompt-box { white-space: pre-wrap; background: #f7f9fc; border-left: 4px solid var(--blue); padding: 12px 14px; border-radius: 8px; }
  .speak { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .speak .ptext { white-space: pre-wrap; font-weight: 600; }
  .recbar { display: flex; align-items: center; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
  .recdot { width: 11px; height: 11px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; display: inline-block; }
  @keyframes pulse { 50% { opacity: .25; } }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .pill.ok { background: var(--good-bg); color: var(--good); } .pill.wait { background: var(--warn-bg); color: var(--warn); }
  .chart { width: 100%; max-width: 620px; display: block; margin: 12px 0; }
  .chart-table { margin: 14px 0; max-width: 620px; overflow-x: auto; }
  .chart-table .ct-title { font-weight: 700; text-align: center; margin-bottom: 8px; }
  .chart-table table { border-collapse: collapse; width: 100%; font-size: 14px; }
  .chart-table th, .chart-table td { border: 1px solid #cfd6e4; padding: 7px 10px; text-align: center; }
  .chart-table thead th { background: #eef3fb; } .chart-table tbody th { text-align: left; font-weight: 600; background: #fafbfd; }
  .pic { margin: 0 0 12px; border: 1px solid #dfe5f0; border-radius: 12px; background: linear-gradient(180deg, #f3f8ff, #fff); padding: 14px; text-align: center; }
  .pic-scene { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 18px; font-size: 54px; line-height: 1.15; }
  .pic figcaption { margin-top: 8px; color: #66708a; font-size: 13px; }
  .navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 8px 16px; display: none; z-index: 20; box-shadow: 0 -4px 16px rgba(11,18,60,.06); }
  .navbar .inner { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .center { text-align: center; } .big-ico { font-size: 44px; line-height: 1; margin-bottom: 8px; }
  /* exam-style question navigation */
  .qnav { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; flex: 1; min-width: 0; }
  .ptabs { display: flex; gap: 4px; }
  .ptab { border: 1px solid var(--border); background: #f6f8fc; border-radius: 8px; padding: 5px 10px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--text); white-space: nowrap; }
  .ptab.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .ptab.live::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2fbf71; margin-right: 6px; vertical-align: 1px; }
  .ptab em { font-style: normal; font-weight: 600; opacity: .7; margin-left: 4px; }
  .qnums { display: flex; gap: 3px; flex-wrap: wrap; }
  .qnum { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 12px; font-weight: 700; cursor: pointer; position: relative; color: var(--text); padding: 0; }
  .qnum.ans { background: #e3edf9; border-color: #b9cfe9; color: #1f4f8a; }
  .qnum.flag::after { content: ""; position: absolute; top: -4px; right: -4px; width: 9px; height: 9px; border-radius: 50%; background: var(--flag); border: 2px solid #fff; }
  .flagbtn { position: absolute; right: 0; top: 10px; border: 1px solid transparent; background: none; color: #a9b1c5; border-radius: 6px; padding: 2px 6px; cursor: pointer; font-size: 13px; }
  .flagbtn:hover { border-color: var(--border); color: var(--flag); }
  .flagbtn.on { color: var(--flag); background: #fff5e0; border-color: #f2d199; }
  .xpart { display: none; } .xpart.on { display: block; }
  .xblock { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--border); }
  .xblock:first-of-type { margin-top: 6px; padding-top: 0; border-top: none; }
  .xblock h3 { margin: 0 0 2px; color: var(--navy); } .instr { margin: 0 0 10px; color: #3a4565; font-size: 14px; }
  .instr b { color: var(--navy); }
  .xtitle { font-weight: 800; text-align: center; margin: 10px 0 4px; color: var(--navy); }
  .xform { border: 1px solid #cfd8e8; border-radius: 10px; padding: 6px 16px; background: #fbfcff; }
  .xq { padding: 9px 30px 9px 0; border-bottom: 1px solid #eef1f6; position: relative; line-height: 2; }
  .xq:last-child { border-bottom: none; }
  .xq input.gap { width: 170px; max-width: 46vw; padding: 4px 8px; border: 1px solid #b9c4d8; border-radius: 6px; font-size: 15px; background: #fff; text-align: center; font-weight: 600; }
  .xq .qn { min-width: 26px; }
  .xq select { padding: 5px 8px; border: 1px solid #b9c4d8; border-radius: 6px; font-size: 14px; font-weight: 700; min-width: 70px; background: #fff; }
  .optbox { border: 1px solid #cfd8e8; border-radius: 10px; padding: 10px 14px; background: #f7f9fd; margin: 6px 0 10px; display: grid; gap: 2px 18px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); font-size: 14px; }
  .plan { width: 100%; max-width: 640px; display: block; margin: 8px auto 10px; border: 1px solid #cfd8e8; border-radius: 10px; background: #fbfcff; }
  .multi label { display: flex; gap: 8px; align-items: flex-start; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; margin-top: 6px; cursor: pointer; background: #fbfcfe; line-height: 1.5; }
  .multi label:has(input:checked) { border-color: var(--blue); background: #eaf1fb; }
  .multi label.off { opacity: .5; }
  .lhead { display: flex; gap: 14px; align-items: center; }
  .lhead .ring { width: 46px; height: 46px; border-radius: 50%; background: #eaf1fb; display: grid; place-items: center; font-size: 22px; flex: none; }
  .lhead.live .ring { background: #e6f6ee; }
  .lhead .lt { flex: 1; }
  .lhead .lt b { display: block; color: var(--navy); font-size: 17px; }
  .lprog { height: 6px; background: #e6eaf2; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .lprog i { display: block; height: 100%; background: var(--blue); width: 0; transition: width .5s linear; }
  /* report */
  .bandgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 14px 0; }
  .band { border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
  .band b { display: block; font-size: 26px; color: var(--navy); }
  .band.tot { background: var(--navy); color: #fff; border-color: var(--navy); } .band.tot b { color: #fff; }
  .rv { padding: 8px 10px; border-radius: 8px; margin: 4px 0; font-size: 14px; }
  .rv.ok { background: #e9f8ef; } .rv.no { background: #fdeef0; }
  .rv .why { color: #4d5875; font-size: 13px; margin-top: 3px; } .rv mark { background: #ffe58a; padding: 0 2px; border-radius: 3px; }
  details.acc { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-top: 10px; background: #fff; }
  details.acc summary { cursor: pointer; font-weight: 700; color: var(--navy); }
  .essay { white-space: pre-wrap; background: #f7f9fc; border-radius: 8px; padding: 12px; margin-top: 8px; }
  .essay mark { background: #ffe1e1; border-bottom: 2px solid #e05a5a; padding: 0 1px; }
  .cmt { font-size: 13px; background: #fff7e6; border-left: 3px solid #f0a020; padding: 6px 10px; border-radius: 6px; margin-top: 6px; }
  /* exam-style reading */
  body.wide main { max-width: 1480px; }
  .rsplit { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .rpass { position: sticky; top: 64px; max-height: calc(100vh - 150px); overflow: auto; padding-right: 8px; }
  .rpass h2 { font-size: 21px; margin-bottom: 2px; } .rpass .rsub { color: var(--dim); font-style: italic; margin: 0 0 12px; font-size: 14px; }
  .rpass p { margin: 0 0 13px; line-height: 1.72; font-size: 15.5px; }
  .rpass p b.pl { color: var(--navy); margin-right: 8px; font-size: 16px; }
  .rpass mark.hl { background: #fff1a8; border-radius: 2px; cursor: pointer; }
  .rq { max-height: calc(100vh - 150px); overflow: auto; position: sticky; top: 64px; padding-right: 6px; }
  .hltip { font-size: 12px; color: var(--dim); margin: -4px 0 10px; }
  .xq .opts.inline label { padding: 4px 10px; }
  /* review & explanations */
  .agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 28px; margin: 10px 0 4px; }
  .agrid .ph { grid-column: 1 / -1; font-weight: 800; color: var(--navy); margin: 12px 0 2px; }
  .arow { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 4px 0; min-width: 0; }
  .arow .nb { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex: none; }
  .arow.no .nb { background: #d6343b; } .arow.ok .nb { background: var(--good); }
  .arow .av { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .arow .ck { color: var(--good); font-weight: 800; } .arow .xx { color: var(--bad); font-weight: 800; }
  .arow .ky { color: var(--dim); font-size: 13px; }
  .rvw { margin-top: 18px; border-radius: 14px; overflow: hidden; border: 1px solid #c9d6ea; }
  .rvw-h { background: #24476e; color: #fff; padding: 12px 18px; font-weight: 800; font-size: 17px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rvw-h .ptabs2 { display: flex; gap: 4px; margin-left: auto; }
  .rvw-h .ptabs2 button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 7px; padding: 4px 10px; font-weight: 700; cursor: pointer; font-size: 12.5px; }
  .rvw-h .ptabs2 button.on { background: #fff; color: #24476e; }
  .rvw-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); max-height: 72vh; }
  .rvw-l { overflow: auto; padding: 14px 18px; background: #fff; border-right: 1px solid #dbe3ef; }
  .rvw-r { position: relative; overflow: auto; padding: 14px 18px; background: #e3f2f7; font-size: 14.5px; line-height: 1.75; }
  .rvw-r p { margin: 0 0 12px; } .rvw-r .spk { font-weight: 700; color: #24476e; margin-right: 4px; }
  .ev { background: #f9a35a; border-radius: 3px; padding: 1px 3px; transition: box-shadow .3s; }
  .ev .tg { background: #e2762a; color: #fff; font-weight: 800; font-size: 11.5px; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
  .ev.flash { box-shadow: 0 0 0 3px #24476e; }
  .xc { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .xc.no { border-left: 4px solid #d6343b; } .xc.ok { border-left: 4px solid var(--good); }
  .xc .xq1 { font-size: 14px; } .xc .xa { font-size: 13.5px; margin-top: 4px; }
  .xc .xa b.c { color: #c0392b; } .xc .xa b.g { color: var(--good); }
  .xc .xe { font-size: 13.5px; color: #33405e; background: #f6f8fc; border-radius: 8px; padding: 8px 10px; margin-top: 6px; }
  .xc .tn { font-size: 13.5px; background: #fff7e6; border-left: 3px solid #f0a020; border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
  .xc .xbtn { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .xc .xbtn button { border: 1px solid #9fb5d6; background: #fff; color: #24476e; border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .xfilter { display: flex; gap: 6px; margin: 4px 0 6px; } .xfilter button { border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .xfilter button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  @media (max-width: 800px) {
    .rsplit { grid-template-columns: 1fr; } .rpass, .rq { position: static; max-height: none; }
    .rvw-b { grid-template-columns: 1fr; max-height: none; } .rvw-r { max-height: 50vh; } .agrid { grid-template-columns: 1fr; }
    .split { grid-template-columns: 1fr; } .passage { position: static; max-height: none; }
    h1 { font-size: 21px; } .card { padding: 16px; } .qnums { display: none; } .vol { display: none !important; }
  }
  /* A1 spoken examiner */
  .lstat.rec { background: #c0352b; color: #fff; }
  .xq { transition: border-color .2s, box-shadow .2s, opacity .2s; }
  .xq.on { border-color: var(--blue, #2d74bb); box-shadow: 0 0 0 3px rgba(45,116,187,.18); }
  .xq.done:not(.on) { opacity: .7; }
  .xq-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .xq-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .ptext.hid { display: none; }
  .xq-listen, .xl-st { display: flex; align-items: center; gap: 6px; font-weight: 700; color: #1d3f72; background: #eef4fb; border-radius: 8px; padding: 8px 12px; margin: 6px 0; }
  .xq-listen .eq, .xl-st .eq { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; }
  .xq-listen .eq i, .xl-st .eq i { width: 3px; background: #2d74bb; border-radius: 2px; animation: eq 0.9s ease-in-out infinite; }
  .xq-listen .eq i:nth-child(2), .xl-st .eq i:nth-child(2) { animation-delay: .15s; } .xq-listen .eq i:nth-child(3), .xl-st .eq i:nth-child(3) { animation-delay: .3s; } .xq-listen .eq i:nth-child(4), .xl-st .eq i:nth-child(4) { animation-delay: .45s; }
  .xlp.on { border-color: var(--blue, #2d74bb); box-shadow: 0 0 0 3px rgba(45,116,187,.14); }
  @media (prefers-reduced-motion: reduce) { .xq-listen .eq i, .xl-st .eq i { animation: none; } }
</style>
</head>

<script>
// The A1 spoken examiner (Life Skills A1, LanguageCert A1).
// Shared by the test page (runs the exam) and voices.mjs (makes the audio files),
// so both always use exactly the same words. Plain ES5 on purpose.
var EXAMINER = (function () {
  // our voices (Microsoft Azure neural, British): X = examiner, F / M = people in the recordings
  var VOICES = { X: "en-GB-SoniaNeural", F: "en-GB-LibbyNeural", M: "en-GB-RyanNeural" };
  var RATE = "-6%";           // A1: a little slower than normal speech
  var BEEP_PAUSE = 400;

  function clean(t) {
    var out = String(t || "")
      .replace(/:\s*\n+\s*[•\-]\s*/g, ": ")          // "about:\n• where" -> "about: where"
      .replace(/\s*[—–]\s*/g, ", ").replace(/\n+\s*[•\-]\s*/g, ", ").replace(/\n+/g, " ").replace(/\s{2,}/g, " ").trim();
    return out && !/[.?!"”]$/.test(out) ? out + "." : out;
  }
  // the examiner talks about itself as "I"
  function firstPerson(t) {
    return String(t || "").replace(/\bthe examiner (?:will )?asks? you\b/gi, "I'm going to ask you").replace(/\bthe examiner\b/gi, "I");
  }
  // spoken form of an answer option: "A  a teacher" -> "A: a teacher."
  function opt(o) {
    var m = String(o).match(/^\s*([A-D])[\s.)]+(.*)$/);
    var s = m ? m[1] + ": " + m[2].trim() : String(o).trim();
    return /[.?!]$/.test(s) ? s : s + ".";
  }
  // drop sentences that only make sense on screen (buttons, recording, playing)
  function spokenIntro(t) {
    var keep = (String(t || "").match(/[^.!?]+[.!?]*/g) || []).filter(function (s) { return !/record|button|press|click|play it|play each|you can play/i.test(s); });
    return clean(firstPerson(keep.join(" ")));
  }
  function unit(segs) { return { segs: segs }; }            // one audio clip: [[voiceKey, text], ...]
  function x(t) { return unit([["X", t]]); }

  // fixed lines used by every test
  var COMMON = {
    soundCheck: x("Hello. If you can hear me clearly, your sound is working."),
    hello: x("Hello. I'm your examiner today. Please listen carefully, and answer after the beep. Let's begin."),
    listenAgain: x("Now listen again."),
    choose: x("Now choose your answers."),
    nextQ: x("Thank you."),
    end: x("Thank you. That is the end of the test. Goodbye.")
  };

  // the steps for one section: say (examiner talks), ask (examiner asks, student answers), play (a recording), answer (time to choose)
  function sectionSteps(sec, si) {
    var steps = [];

    box.innerHTML = '<div class="rvw-h">📖 Review &amp; Explanations<div class="ptabs2">' + tabs + '</div></div>' +
      '<div class="rvw-b"><div class="rvw-l"><div class="xfilter"><button data-only="0" class="' + (!x.only ? "on" : "") + '">All questions</button><button data-only="1" class="' + (x.only ? "on" : "") + '">Wrong answers only</button></div>' + cards + '</div>' +
      '<div class="rvw-r">' + (sec.type === "reading" ? '<h3 style="color:#24476e">' + esc(p.heading || p.title) + '</h3>' : '<p class="dim" style="margin-top:0"><b>Recording transcript</b></p>') + right + '</div></div>';
    box.querySelectorAll("[data-pt]").forEach(function (b) { b.onclick = function () { stopSpeaking(); x.part = +b.dataset.pt; drawReview(i); }; });
    box.querySelectorAll("[data-only]").forEach(function (b) { b.onclick = function () { x.only = b.dataset.only === "1"; drawReview(i); }; });
    box.querySelectorAll("[data-loc]").forEach(function (b) { b.onclick = function () { locate(box, b.dataset.loc); }; });
    box.querySelectorAll("[data-lis]").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.on) { stopSpeaking(); b.textContent = "🎧 Listen from here"; delete b.dataset.on; return; }
        box.querySelectorAll("[data-lis][data-on]").forEach(function (o) { o.textContent = "🎧 Listen from here"; delete o.dataset.on; });
        var el = locate(box, b.dataset.lis); if (!el) return;
        var pEl = el.closest("p"), idx = Array.prototype.indexOf.call(box.querySelectorAll(".rvw-r p"), pEl) - 1;
        var rest = lines.slice(Math.max(0, idx)).map(function (l) { return [l.spk || "N", l.t]; });
        b.dataset.on = "1"; b.textContent = "⏹ Stop";
        warmUp(function () { speakLines(rest, function () { b.textContent = "🎧 Listen from here"; delete b.dataset.on; }); });
      };
    });
  }
  function locate(box, key) {
    var el = box.querySelector('[data-ev~="' + key + '"]');
    if (!el) return null;
    var pane = box.querySelector(".rvw-r");
    pane.scrollTo({ top: el.offsetTop - 60, behavior: "smooth" });
    if (window.innerWidth <= 800) el.scrollIntoView({ behavior: "smooth", block: "center" });
    box.querySelectorAll(".ev.flash").forEach(function (e) { e.classList.remove("flash"); });
    el.classList.add("flash"); setTimeout(function () { el.classList.remove("flash"); }, 2200);
    return el;
  }
  function markEssay(text, cm) {
    var marks = cm.slice().filter(function (c) { return c.end > c.start && c.end <= text.length; }).sort(function (a, b) { return a.start - b.start; });
    var out = "", at = 0;
    marks.forEach(function (c, i) { if (c.start < at) return; out += esc(text.slice(at, c.start)) + '<mark title="' + esc(c.note) + '">' + esc(text.slice(c.start, c.end)) + '<sup>' + (cm.indexOf(c) + 1) + '</sup></mark>'; at = c.end; });
    return out + esc(text.slice(at));
  }

  // ---------- start ----------
  if (!token) { showError("not_found"); return; }
  rpc("ielts_public_test", { p_token: token }).then(function (d) {
    if (d && d.report) { renderReport(d.report); return; }
    if (!d || d.error) { showError(d ? d.error : "", d && d.student_name); return; }
    S.data = d;
    S.answers = d.answers || {};
    S.transcripts = d.transcripts || {};
    var serverPos = S.answers.__lpos; delete S.answers.__lpos;
    (d.audio_done || []).forEach(function (id) { S.audioDone[id] = true; });
    try {
      var saved = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      if (saved.answers) Object.keys(saved.answers).forEach(function (k) { if (!(k in S.answers) || !S.answers[k]) S.answers[k] = saved.answers[k]; });
      if (saved.transcripts) Object.keys(saved.transcripts).forEach(function (k) { if (!S.transcripts[k]) S.transcripts[k] = saved.transcripts[k]; });
      if (saved.plays) S.plays = saved.plays;
      if (saved.flags) S.flags = saved.flags;
      if (saved.meta) S.meta = Object.assign(S.meta, saved.meta);
      if (saved.timerEnd) S.timerEnd = saved.timerEnd;
      L.saved = saved.lpos || serverPos || null;
      var idx = typeof saved.secIndex === "number" && saved.secIndex >= 0 ? saved.secIndex : (L.saved ? L.saved.s : -1);
      if (idx >= 0) {
        var inListening = isExamListening(sections()[idx]);
        main.innerHTML = '<div class="card center"><h1>Welcome back, ' + esc(d.student_name) + '</h1><p class="dim">Your answers were saved. ' +
          (inListening ? 'The Listening recording will continue from where it stopped — it won\'t start again from the beginning.' : 'Continue where you left off.') + '</p><button class="btn" id="resume">Continue</button></div>';
        $("resume").onclick = function () { $("resume").disabled = true; warmUp(function () { S.secIndex = -1; goSection(idx, L.saved); }); };
        return;
      }
    } catch (e) {}
    welcome();
  }).catch(function () { showError(""); });
  window.addEventListener("beforeunload", function (e) { if (S.secIndex >= 0 && !S.submitted) { lsSave(); e.preventDefault(); e.returnValue = ""; } });
})();
</script>
</body>
</html>
